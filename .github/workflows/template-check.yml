name: Project readiness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: verify
        if: ${{ !cancelled() }}
        run: python scripts/verify.py --profile current --readiness --strict-manifest
      - run: python scripts/test_framework.py --if-template
      - name: Preserve verification summaries
        if: ${{ always() && steps.verify.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*/summary.md
          if-no-files-found: warn
          retention-days: 14
